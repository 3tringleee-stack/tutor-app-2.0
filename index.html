  detailSid=null;
  const data=JSON.stringify({app:"tutor-ledger",version:2,exported:new Date().toISOString(),students,months});
  const local = mode==="local";
  openModal(`<h3>Резервная копия</h3>
    <div class="hint" style="margin-top:0">${local?"Скачайте файл и храните его, например, в облаке. Из него можно восстановить все записи.":"Или скопируйте текст ниже и сохраните в заметках. Чтобы восстановить: «Резервная копия» → вставьте текст в поле ниже."}</div>
    <div class="foot" style="margin-top:10px">
      ${local?`<button class="primary" type="button" id="bkDl">Скачать файл</button>`:""}
      <button class="${local?"secondary":"primary"}" type="button" id="bkCopy">Скопировать данные</button>
    </div>
    <div class="foot" style="margin-top:8px"><button class="secondary" type="button" id="bkCsv">Весь журнал в Excel</button></div>
    <textarea id="bkOut" style="min-height:70px;margin-top:10px" readonly>${esc(data)}</textarea>
    <div class="hint" id="bkHint"></div>
    <h3 style="margin-top:18px;font-size:16px">Восстановить из копии</h3>
    <div class="hint" style="margin-top:0">Выберите файл копии или вставьте скопированный текст. Текущие данные будут заменены.</div>
    <input type="file" id="bkFile" accept=".json,application/json,text/plain" style="margin-top:8px">
    <textarea id="bkIn" style="min-height:70px;margin-top:8px" placeholder="или вставьте текст копии сюда"></textarea>
    <div class="hint" id="bkPrev"></div>
    <div class="hint" style="margin-top:10px">Хранилище: ${mode==="cloud"?"облако Telegram":mode==="db"?"аккаунт Claude":mode==="demo"?"пробный режим, ничего не сохраняется":"это устройство"} · ${esc(diag)}</div>
    <div class="foot"><button class="secondary" type="button" id="bkClose">Закрыть</button><button class="secondary" type="button" id="bkRestore" disabled>Заменить данные</button></div>`);
  $("bkClose").onclick=closeModal;
  const markBackup=()=>{ try{ localStorage.setItem("tutor-last-backup",String(Date.now())); }catch(e){} };
  if(local) $("bkDl").onclick=()=>{
    const blob=new Blob([data],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="tabel-kopiya-"+today()+".json"; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
    markBackup(); $("bkHint").textContent="Файл сохранён в «Загрузки».";
  };
  $("bkCopy").onclick=()=>copyText($("bkOut"),$("bkHint"),markBackup);
  $("bkCsv").onclick=()=>{
    const rows=journalRows();
    $("bkOut").value=toTSV(rows);
    saveXLSX("tabel-zhurnal-"+today()+".xlsx","Журнал",rows,{widths:[12,24,26,9,13,14,32],money:[4,5],ints:[]},$("bkHint"));
  };
  let incoming=null;
  const check=text=>{
    incoming=null; $("bkRestore").disabled=true;
    try{
      const o=JSON.parse(text);
      if(!o || !Array.isArray(o.students) || typeof o.months!=="object") throw 0;
      incoming=o;
      $("bkPrev").innerHTML=`Найдено: учеников ${o.students.filter(x=>!x.archived).length}, записей ${Object.values(o.months).flat().length}${o.exported?", копия от "+esc(o.exported.slice(0,10)):""}.`;
      $("bkRestore").disabled=false;
    }catch(e){ $("bkPrev").innerHTML=text.trim()?'<span class="warn">Это не похоже на резервную копию приложения.</span>':""; }
  };
  $("bkIn").oninput=()=>check($("bkIn").value);
  $("bkFile").onchange=()=>{ const f=$("bkFile").files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $("bkIn").value=r.result; check(r.result); }; r.readAsText(f); };
  $("bkRestore").onclick=()=>{
    if(!incoming) return;
    const oldKeys=Object.keys(months);
    students=incoming.students.map(x=>({...x})); normStudents();
    months={}; for(const k in incoming.months) months[k]=(incoming.months[k]||[]).map(x=>({...x}));
    if(mode==="db"||mode==="cloud"){ saveStudents(); new Set(oldKeys.concat(Object.keys(months))).forEach(k=>{ if(!months[k]) months[k]=[]; saveMonth(k); }); }
    else saveLocal();
    closeModal(); render();
  };
}

/* --- минимальный генератор .xlsx без библиотек --- */
function xlsxBytes(sheetName, rows, opts){
  opts=opts||{};
  const widths=opts.widths||[], money=new Set(opts.money||[]), ints=new Set(opts.ints||[]);
  const esc=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const colName=n=>{ let s=""; n++; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26);} return s; };
  const cols = widths.length ? "<cols>"+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")+"</cols>" : "";
  const body = rows.map((row,ri)=>{
    const cells=row.map((v,ci)=>{
      const ref=colName(ci)+(ri+1);
      if(ri===0) return `<c r="${ref}" s="1" t="inlineStr"><is><t>${esc(v)}</t></is></c>`;
      if(typeof v==="number" && isFinite(v)){
        const st = money.has(ci) ? 2 : (ints.has(ci) ? 4 : 3);
        return `<c r="${ref}" s="${st}"><v>${v}</v></c>`;
      }
      return `<c r="${ref}" s="3" t="inlineStr"><is><t>${esc(v)}</t></is></c>`;
    }).join("");
    return `<row r="${ri+1}"${ri===0?' ht="24" customHeight="1"':''}>${cells}</row>`;
  }).join("");
  const lastCol=colName(Math.max(0,(rows[0]||[]).length-1));
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols}<sheetData>${body}</sheetData><autoFilter ref="A1:${lastCol}1"/></worksheet>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="#,##0&quot; ₽&quot;"/><numFmt numFmtId="165" formatCode="0.##"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2B5C8A"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFD5DDE5"/></left><right style="thin"><color rgb="FFD5DDE5"/></right><top style="thin"><color rgb="FFD5DDE5"/></top><bottom style="thin"><color rgb="FFD5DDE5"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles><dxfs count="0"/><tableStyles count="0" defaultTableStyle="TableStyleMedium2" defaultPivotStyle="PivotStyleLight16"/></styleSheet>`;
  const files=[
    ["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
    ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${esc(sheetName).slice(0,31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml",styles],
    ["xl/worksheets/sheet1.xml",sheet]
  ];
  /* zip (store) */
  const enc=new TextEncoder();
  const table=(()=>{ const t=new Uint32Array(256); for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[i]=c>>>0; } return t; })();
  const crc32=buf=>{ let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++) c=table[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  const parts=[], central=[]; let offset=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(([name,content])=>{
    const nameB=enc.encode(name), data=enc.encode(content), crc=crc32(data);
    const local=[].concat([80,75,3,4],u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0));
    parts.push(new Uint8Array(local),nameB,data);
    central.push([].concat([80,75,1,2],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset)),nameB);
    offset+=local.length+nameB.length+data.length;
  });
  const cdParts=[]; let cdLen=0;
  for(let i=0;i<central.length;i+=2){ const a=new Uint8Array(central[i]), b=central[i+1]; cdParts.push(a,b); cdLen+=a.length+b.length; }
  const eocd=new Uint8Array([].concat([80,75,5,6],u16(0),u16(0),u16(files.length),u16(files.length),u32(cdLen),u32(offset),u16(0)));
  const all=parts.concat(cdParts,[eocd]);
  const total=all.reduce((a,x)=>a+x.length,0), out=new Uint8Array(total);
  let pos=0; all.forEach(x=>{ out.set(x,pos); pos+=x.length; });
  return out;
}

function saveXLSX(name, sheet, rows, opts, hintEl){
  if(TG){
    if(hintEl) hintEl.innerHTML='Внутри Telegram файлы не скачиваются — это ограничение самого Telegram. Скопируйте таблицу кнопкой рядом, она вставится в Excel сразу по столбцам, либо <button class="sm" type="button" data-openbrowser="1">откройте приложение в браузере</button> — там файл скачается.';
    return;
  }
  try{
    const bytes=xlsxBytes(sheet, rows, opts);
    const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
    if(hintEl) hintEl.textContent="Файл "+name+" сохранён в «Загрузки» — откройте двойным щелчком.";
  }catch(e){ if(hintEl) hintEl.innerHTML='<span class="warn">Не удалось сохранить файл. Скопируйте таблицу кнопкой рядом.</span>'; }
}

function registryRows(key){
  const rows=[["Ученик","Группа","Договор","Занятий по плану","Проведено занятий","Проведено часов","К оплате, ₽","С прошлого месяца, ₽","Получено, ₽","Осталось оплатить, ₽","Способ оплаты","Статус"]];
  const tot=[0,0,0,0,0,0,0];
  payCheck(key).forEach(r=>{
    const m=monthStats(r.st,key);
    const left=r.left;
    tot[0]+=m.plan; tot[1]+=m.held; tot[2]+=m.heldH; tot[3]+=r.need; tot[4]+=r.got; tot[5]+=left; tot[6]+=r.carry;
    rows.push([fullName(r.st),r.st.group||"",[r.st.contractNo||"",r.st.contractDate||""].filter(Boolean).join(" от "),
      m.plan,m.held,+m.heldH.toFixed(2),Math.round(r.need),r.carry,Math.round(r.got),Math.round(left),
      PAYM[r.st.payMethod]||"", {none:"не оплачено",part:"частично",wait:"ждём оплату за месяц",ok:"оплачено",empty:"занятий нет"}[r.status]]);
  });
  rows.push(["ИТОГО","","",tot[0],tot[1],+tot[2].toFixed(2),Math.round(tot[3]),Math.round(tot[6]),Math.round(tot[4]),Math.round(tot[5]),"",""]);
  return rows;
}

const toTSV = rows => rows.map(r=>r.map(v=>String(v??"").replace(/[\t\r\n]+/g," ")).join("\t")).join("\n");

    ${held===0?`<div class="insight">В ${MONTHS_GEN[+key.slice(5)-1]} ещё нет отмеченных занятий, поэтому «проведено» нулевое. Колонка «К оплате» у тех, кто платит за месяц вперёд, считается по плану. Листайте стрелками, чтобы открыть прошлый месяц.</div>`:""}
    <textarea id="rgOut" style="min-height:160px" readonly>${esc(tsv)}</textarea>
    <div class="hint" id="rgHint">«Скопировать для Excel» — вставляется сразу по столбцам, ничего настраивать не нужно.</div>
    <div class="foot"><button class="secondary" type="button" id="rgClose">Закрыть</button>
      <button class="secondary" type="button" id="rgXl">Скачать Excel</button>
      <button class="primary" type="button" id="rgCopy">Скопировать для Excel</button></div>`);

function journalRows(){
  const TYPES={lesson:"занятие",payment:"оплата",skip:"каникулы",moved:"перенос",makeup:"перенесённое занятие",cancel:"отмена"};
  const rows=[["Дата","Ученик","Тип","Часы","Ставка, ₽","Сумма, ₽","Заметка"]];
  allEvents().slice().sort((a,b)=>a.date<b.date?-1:1).forEach(e=>{
    const st=students.find(x=>x.id===e.sid)||{name:"?"};
    let type=TYPES[e.type]||e.type, sum="";
    if(e.trial) type="пробное занятие";
    if(e.type==="payment") sum=Math.round(+e.amount||0);
    else { const c=costOf(e,st); if(c) sum=Math.round(c); }
    if(e.type==="cancel") type += e.status==="charged" ? " с оплатой" : e.status==="free" ? " без оплаты" : " без решения";
    if(e.type==="moved") type += e.toDate ? " на "+e.toDate : " (дата не назначена)";
    rows.push([e.date,fullName(st),type,e.type==="payment"?"":(+(e.hours||1)),e.type==="payment"?"":(+(e.price||st.price||0)),sum===""?0:sum,e.comment||""]);
  });
  return rows;
}

/* ---------- import ---------- */
const WD_MAP={"пн":1,"вт":2,"ср":3,"чт":4,"пт":5,"сб":6,"вс":0};
const toMin = t => { const [h,m]=t.replace(".",":").split(":").map(Number); return h*60+m; };
function parseImport(text){
  let from=today().slice(0,7)+"-01"; const items=[]; const errors=[];
  text.split(/\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
    let m=line.match(/^с\s+(\d{1,2})\.(\d{1,2})\.(\d{4})$/i);
    if(m){ from=m[3]+"-"+pad(m[2])+"-"+pad(m[1]); return; }
    m=line.match(/^с\s+(\d{4}-\d{2}-\d{2})$/i);
    if(m){ from=m[1]; return; }
    const i=line.indexOf(":");
    if(i<1){ errors.push(line); return; }
    const name=line.slice(0,i).trim(), rest=line.slice(i+1).trim();
    if(/^нет$/i.test(rest)){ items.push({name,remove:true}); return; }
    const days=[], times={}, durs={}; let ok=true;
    rest.split(/[,;]/).map(x=>x.trim()).filter(Boolean).forEach(part=>{
      const mm=part.match(/^(пн|вт|ср|чт|пт|сб|вс)\s*(\d{1,2}[:.]\d{2})?(?:\s*[-–—]\s*(\d{1,2}[:.]\d{2}))?(?:\s*\(?\s*(\d+(?:[.,]\d+)?)\s*ч\.?\s*\)?)?$/i);
      if(!mm){ ok=false; return; }
      const w=WD_MAP[mm[1].toLowerCase()];
      if(!days.includes(w)) days.push(w);
      if(mm[2]) times[w]=mm[2].replace(".",":").padStart(5,"0");
      if(mm[2]&&mm[3]){ const d=(toMin(mm[3])-toMin(mm[2]))/60; if(d>0) durs[w]=d; }
      if(mm[4]) durs[w]=num(mm[4]);
    });
    if(!ok||!days.length){ errors.push(line); return; }
    items.push({name,days:days.sort(),times,durs});
  });
  return {from,items,errors};
}
function findStudent(name){ const n=name.toLowerCase().replace(/\s+/g," "); return students.find(s=>s.name.toLowerCase().replace(/\s+/g," ")===n); }
function openImport(){
  detailSid=null;
  openModal(`<h3>Импорт расписания</h3>
    <div class="hint" style="margin-top:0">Одна строка — один ученик: <b>Имя: Вт 16:00-18:00, Чт 17:00</b> (или <b>Вт 16:00 2ч</b>). Если длительность не указана, берётся обычная длительность ученика. Строка <b>с 01.09.2026</b> — дата начала. <b>Имя: нет</b> убирает ученика.</div>
    <textarea id="impText" style="min-height:200px" placeholder="с 01.09.2026&#10;Арина: Вт 16:00-17:00"></textarea>
    <div id="impPrev" class="hint"></div>
    <div class="foot"><button class="secondary" type="button" id="impClose">Отмена</button><button class="secondary" type="button" id="impCheck">Проверить</button><button class="primary" type="button" id="impApply" disabled>Применить</button></div>`);
  let parsed=null;
  const check=()=>{
    parsed=parseImport($("impText").value);
    const rows=parsed.items.map(it=>{
      const st=findStudent(it.name);
      if(it.remove) return `<div>${esc(it.name)}: ${st?"убрать из списка":"<span class='warn'>не найден</span>"}</div>`;
      const d=WD_ORDER.filter(w=>it.days.includes(w)).map(w=>WD[w]+(it.times[w]?" "+it.times[w]:"")+(it.durs[w]?" ("+fmtH(it.durs[w])+")":"")).join(", ");
      return `<div><b>${esc(it.name)}</b>${st?"":" <span class='warn'>(новый ученик)</span>"}: ${d}</div>`;
    }).join("");
    $("impPrev").innerHTML = parsed.items.length ? `<div style="color:var(--ink);margin:8px 0 4px">Будет применено с ${fmtDate(parsed.from)}.${parsed.from.slice(0,4)}:</div>${rows}` : "Нет строк для импорта.";
    if(parsed.errors.length) $("impPrev").innerHTML+=`<div class="warn" style="margin-top:6px">Не распознано: ${parsed.errors.map(esc).join(" | ")}</div>`;
    $("impApply").disabled=!parsed.items.length;
  };
  $("impCheck").onclick=check;
  $("impText").oninput=()=>{ $("impApply").disabled=true; };
  $("impClose").onclick=closeModal;
  $("impApply").onclick=()=>{
    if(!parsed) return;
    parsed.items.forEach(it=>{
      let st=findStudent(it.name);
      if(it.remove){ if(st) students=students.map(s=>s.id===st.id?{...s,archived:true}:s); return; }
      if(!st){ st={id:"s"+uid(),name:it.name,perWeek:it.days.length,price:0,hours:1,note:"",mode:"",sched:[],archived:false}; students=students.concat([st]); }
      const sched=(st.sched||[]).filter(p=>p.from<parsed.from).concat([{from:parsed.from,days:it.days,times:it.times,durs:it.durs}]);
      students=students.map(s=>s.id===st.id?{...s,sched,perWeek:it.days.length,archived:false}:s);
    });
    saveStudents(); tab="st"; closeModal(); render();
  };
}
